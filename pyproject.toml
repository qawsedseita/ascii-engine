[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asciiengine"
version = "0.2.0"
description = "Semantic ASCII game engine designed for AI-operated workflows"
requires-python = ">=3.12"

[project.optional-dependencies]
imaging = ["Pillow>=10"]

[tool.setuptools.packages.find]
include = ["asciiengine*"]
